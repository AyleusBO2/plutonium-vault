<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submit Content - Plutonium Vault</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

    <style>
        .submit-panel {
            width: min(900px, 92%);
            margin: 60px auto;
            padding: 45px;
            background: #111;
            border: 1px solid #2b2b2b;
            border-top: 3px solid #ff7a00;
        }

        .submit-label {
            color: #ff7a00;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }

        .submit-panel h1 {
            margin: 0 0 10px;
            color: #ff7a00;
            font-size: 44px;
            letter-spacing: 3px;
        }

        .submit-description {
            color: #999;
            margin-bottom: 35px;
        }

        .submit-form {
            display: grid;
            gap: 22px;
        }

        .submit-field {
            display: grid;
            gap: 8px;
        }

        .submit-field[hidden] {
    display: none !important;
}

        .submit-field label {
            color: #aaa;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .submit-field input,
        .submit-field select,
        .submit-field textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            background: #0b0b0b;
            border: 1px solid #333;
            color: white;
            font-family: inherit;
            outline: none;
        }

        .submit-field input:focus,
        .submit-field select:focus,
        .submit-field textarea:focus {
            border-color: #ff7a00;
            box-shadow: 0 0 12px rgba(255, 122, 0, .2);
        }

        .submit-field textarea {
            min-height: 130px;
            resize: vertical;
        }

        .submit-file {
            padding: 25px;
            border: 1px dashed #444;
            background: #0b0b0b;
        }

        .submit-file small {
            display: block;
            margin-top: 8px;
            color: #777;
        }

        .submit-button {
            margin-top: 10px;
            padding: 17px 30px;
            background: transparent;
            border: 2px solid #ff7a00;
            color: #ff7a00;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            transition: .2s;
        }

        .submit-button:hover {
            background: #ff7a00;
            color: #111;
            box-shadow: 0 0 25px rgba(255, 122, 0, .35);
        }

        .submit-button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .submit-message {
            min-height: 20px;
            color: #ff7a00;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .submit-back {
            display: inline-block;
            margin-top: 25px;
            color: #777;
            text-decoration: none;
            letter-spacing: 2px;
            font-size: 12px;
        }

        .submit-back:hover {
            color: #ff7a00;
        }

      /* =========================================
   CUSTOM FILE UPLOADS
========================================= */

.submit-file {
    position: relative;

    padding: 22px;

    background:
        linear-gradient(
            135deg,
            rgba(255, 122, 0, 0.035),
            #0b0b0b 45%
        );

    border: 1px solid #2d2d2d;
    border-left: 3px solid #ff7a00;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.submit-file:hover {
    border-color: #444;
    border-left-color: #ff7a00;

    box-shadow:
        0 0 18px rgba(255, 122, 0, 0.08);
}

.submit-file label {
    margin-bottom: 4px;

    color: #ff7a00;

    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
}

.submit-file input[type="file"] {
    padding: 8px;

    background: #080808;
    color: #bdbdbd;

    border: 1px solid #292929;

    font-size: 12px;

    cursor: pointer;
}

.submit-file input[type="file"]::file-selector-button {
    margin-right: 15px;
    padding: 11px 16px;

    background: #171717;
    color: #ffffff;

    border: 1px solid #ff7a00;

    font-family: inherit;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;

    cursor: pointer;

    transition:
        background 0.2s ease,
        color 0.2s ease,
        box-shadow 0.2s ease;
}

.submit-file input[type="file"]::file-selector-button:hover {
    background: #ff7a00;
    color: #090909;

    box-shadow:
        0 0 15px rgba(255, 122, 0, 0.25);
}

.submit-file small {
    margin-top: 6px;

    color: #666;

    font-size: 10px;
    letter-spacing: 0.5px;
}  

/* =========================================
   PREMIUM UPLOAD FIELD UPGRADE
========================================= */

.submit-file {
    padding: 20px 22px 18px;

    background:
        linear-gradient(
            135deg,
            rgba(255, 122, 0, 0.05),
            rgba(255, 122, 0, 0.015) 38%,
            #0b0b0b 72%
        );

    border: 1px solid #292929;
    border-left: 3px solid #ff7a00;

    box-shadow:
        inset 0 0 30px rgba(255, 122, 0, 0.015);

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
}

.submit-file:hover {
    border-color: #3a3a3a;
    border-left-color: #ff7a00;

    box-shadow:
        0 0 22px rgba(255, 122, 0, 0.08),
        inset 0 0 35px rgba(255, 122, 0, 0.025);

    transform: translateY(-1px);
}


/* FIELD TITLE */

.submit-file label {
    position: relative;

    margin-bottom: 7px;

    color: #ff7a00;

    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2.3px;
}

.submit-file label::before {
    content: "◆";

    margin-right: 8px;

    color: #ff7a00;

    font-size: 7px;
}


/* FILE INPUT CONTAINER */

.submit-file input[type="file"] {
    min-height: 52px;

    padding: 7px;

    background:
        linear-gradient(
            90deg,
            #080808,
            #0c0c0c
        );

    color: #aaa;

    border: 1px solid #252525;

    font-size: 11px;
    letter-spacing: 0.3px;

    cursor: pointer;

    transition:
        border-color 0.2s ease,
        background 0.2s ease;
}

.submit-file input[type="file"]:hover {
    border-color: #3b3b3b;
    background: #0d0d0d;
}


/* CHOOSE FILE BUTTON */

.submit-file input[type="file"]::file-selector-button {
    height: 38px;

    margin-right: 16px;
    padding: 0 18px;

    background:
        linear-gradient(
            180deg,
            #191919,
            #101010
        );

    color: #fff;

    border: 1px solid #ff7a00;

    font-family: inherit;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 1px;

    cursor: pointer;

    transition:
        background 0.2s ease,
        color 0.2s ease,
        box-shadow 0.2s ease;
}

.submit-file input[type="file"]::file-selector-button:hover {
    background: #ff7a00;
    color: #070707;

    box-shadow:
        0 0 16px rgba(255, 122, 0, 0.35);
}


/* HELP TEXT */

.submit-file small {
    margin-top: 8px;

    color: #565656;

    font-size: 9px;
    letter-spacing: 0.7px;
}


/* MENU SCREEN SECONDARY FIELDS */

#menu-screen-preview-2-field,
#menu-screen-download-2-field {
    margin-top: -6px;

    background:
        linear-gradient(
            135deg,
            rgba(255, 122, 0, 0.025),
            #0a0a0a 65%
        );

    border-left-color: #9b4d00;
}

#menu-screen-preview-2-field label,
#menu-screen-download-2-field label {
    color: #d96b00;
}
    </style>
</head>

<body>

<main>

    <section class="submit-panel">

        <div class="submit-label">
            ◆ PLUTONIUM VAULT
        </div>

        <h1>SUBMIT CONTENT</h1>

        <p class="submit-description">
            Submit your custom content to Plutonium Vault for review.
        </p>

        <form
            id="submit-content-form"
            class="submit-form"
        >

            <div class="submit-field">

                <label for="submit-type">
                    CONTENT TYPE
                </label>

<select id="submit-type" required>

    <option value="calling-card">
        CALLING CARD
    </option>

    <option value="emblem">
        EMBLEM
    </option>

    <option value="camo">
        CAMO
    </option>

    <option value="menu-screen">
        MENU SCREEN
    </option>

    <option value="gloves">
        GLOVES
    </option>

    <option value="prestige-icon">
        PRESTIGE ICON
    </option>

    <option value="mod-asset">
        MOD ASSET
    </option>

</select>

            </div>


            <div class="submit-field">

                <label for="submit-title">
                    TITLE
                </label>

                <input
                    type="text"
                    id="submit-title"
                    maxlength="80"
                    placeholder="ENTER CONTENT TITLE..."
                    required
                >

            </div>


            <div class="submit-field">

                <label for="submit-description">
                    DESCRIPTION
                </label>

                <textarea
                    id="submit-description"
                    maxlength="500"
                    placeholder="DESCRIBE YOUR CONTENT..."
                    required
                ></textarea>

            </div>


           <div class="submit-field submit-file">

    <label
        for="submit-preview"
        id="submit-preview-label"
    >
        PREVIEW IMAGE
    </label>

    <input
        type="file"
        id="submit-preview"
        accept="image/png,image/jpeg,image/webp,image/gif"
        required
    >

    <small id="submit-preview-help">
        PNG, JPG, WEBP or GIF.
    </small>

</div>

<div
    class="submit-field submit-file"
    id="menu-screen-preview-2-field"
    hidden
>
    <label for="submit-preview-2">
        MENU SCREEN PREVIEW 2
    </label>

    <input
        type="file"
        id="submit-preview-2"
        accept="image/png,image/jpeg,image/webp,image/gif"
    >

    <small>
        Upload the second menu screen image.
    </small>
</div>


            <div class="submit-field submit-file">

                <label for="submit-download">
                    CONTENT FILE
                </label>

                <input
                    type="file"
                    id="submit-download"
                    required
                >

                <small>
                    Upload the file users will download.
                </small>

            </div>

            <div
    class="submit-field submit-file"
    id="menu-screen-download-2-field"
    hidden
>

    <label for="submit-download-2">
        MENU SCREEN CONTENT FILE 2
    </label>

    <input
        type="file"
        id="submit-download-2"
    >

    <small>
        Upload the second menu screen content file.
    </small>

</div>


            <div
                id="submit-message"
                class="submit-message"
                aria-live="polite"
            ></div>


            <button
                type="submit"
                id="submit-content-button"
                class="submit-button"
            >
                SUBMIT FOR REVIEW
            </button>

        </form>


        <a
            href="index.html"
            class="submit-back"
        >
            ← RETURN TO VAULT
        </a>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script src="js/auth.js"></script>

<script>

const form =
    document.getElementById(
        "submit-content-form"
    );

const message =
    document.getElementById(
        "submit-message"
    );

const submitButton =
    document.getElementById(
        "submit-content-button"
    );

const typeSelect =
    document.getElementById(
        "submit-type"
    );

const previewInput =
    document.getElementById(
        "submit-preview"
    );

const previewLabel =
    document.getElementById(
        "submit-preview-label"
    );

const previewHelp =
    document.getElementById(
        "submit-preview-help"
    );

    const previewInput2 =
    document.getElementById(
        "submit-preview-2"
    );

const previewField2 =
    document.getElementById(
        "menu-screen-preview-2-field"
    );

    const downloadInput2 =
    document.getElementById(
        "submit-download-2"
    );

const downloadField2 =
    document.getElementById(
        "menu-screen-download-2-field"
    );


function updatePreviewRequirements() {

    const selectedType =
        typeSelect?.value;

      const isMenuScreen =
    selectedType === "menu-screen";

    const needsSecondDownload =
    selectedType === "menu-screen" ||
    selectedType === "prestige-icon";

if (previewField2) {
    previewField2.hidden =
        !isMenuScreen;
}

if (previewInput2) {
    previewInput2.required =
        isMenuScreen;

    if (!isMenuScreen) {
        previewInput2.value = "";
    }
}  

if (downloadField2) {

    downloadField2.hidden =
        !needsSecondDownload;

    const downloadLabel2 =
        downloadField2.querySelector("label");

    const downloadHelp2 =
        downloadField2.querySelector("small");

    if (selectedType === "prestige-icon") {

        downloadLabel2.textContent =
            "PRESTIGE ICON CONTENT FILE 2";

        downloadHelp2.textContent =
            "Upload the second .IWI file required for the prestige icon.";

    } else {

        downloadLabel2.textContent =
            "MENU SCREEN CONTENT FILE 2";

        downloadHelp2.textContent =
            "Upload the second menu screen content file.";

    }
}

if (downloadInput2) {

    downloadInput2.required =
        needsSecondDownload;

    if (!needsSecondDownload) {
        downloadInput2.value = "";
    }

}

    if (
        selectedType === "camo"
    ) {

        previewLabel.textContent =
            "CAMO PREVIEW VIDEO";

        previewInput.accept =
            "video/mp4,video/webm";

        previewHelp.textContent =
            "Upload a short MP4 or WEBM video showing the camo in-game.";

        return;
    }

    previewLabel.textContent =
        "PREVIEW IMAGE";

    previewInput.accept =
        "image/png,image/jpeg,image/webp,image/gif";

    previewHelp.textContent =
        "PNG, JPG, WEBP or GIF.";
}


typeSelect?.addEventListener(
    "change",
    updatePreviewRequirements
);

updatePreviewRequirements();

form?.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        message.textContent = "";

        submitButton.disabled = true;

        submitButton.textContent =
            "SUBMITTING...";


        try {

            const {
                data: {
                    user
                },
                error: userError
            } =
                await vaultSupabase
                    .auth
                    .getUser();


            if (
                userError ||
                !user
            ) {

                throw new Error(
                    "YOU MUST BE LOGGED IN TO SUBMIT CONTENT"
                );

            }


            const type =
                document
                    .getElementById(
                        "submit-type"
                    )
                    .value;


            const title =
                document
                    .getElementById(
                        "submit-title"
                    )
                    .value
                    .trim();


            const description =
                document
                    .getElementById(
                        "submit-description"
                    )
                    .value
                    .trim();


            const previewFile =
                document
                    .getElementById(
                        "submit-preview"
                    )
                    .files[0];

                    const previewType =
    previewFile?.type
        ?.startsWith("video/")
        ? "video"
        : "image";

        const previewFile2 =
    type === "menu-screen"
        ? document
            .getElementById(
                "submit-preview-2"
            )
            .files[0]
        : null;


            const downloadFile =
                document
                    .getElementById(
                        "submit-download"
                    )
                    .files[0];

const downloadFile2 =
    (
        type === "menu-screen" ||
        type === "prestige-icon"
    )
        ? document
            .getElementById(
                "submit-download-2"
            )
            .files[0]
        : null;


            if (
                !previewFile ||
                !downloadFile
            ) {

                throw new Error(
                    "PLEASE SELECT BOTH FILES"
                );

            }

            if (
    type === "menu-screen" &&
    (
        !previewFile2 ||
        !downloadFile2
    )
) {

    throw new Error(
        "MENU SCREENS REQUIRE 2 PREVIEW IMAGES AND 2 CONTENT FILES"
    );

}

if (
    type === "prestige-icon" &&
    !downloadFile2
) {

    throw new Error(
        "PRESTIGE ICONS REQUIRE 2 CONTENT FILES"
    );

}

            if (
    type === "camo" &&
    previewType !== "video"
) {

    throw new Error(
        "CAMOS REQUIRE AN MP4 OR WEBM PREVIEW VIDEO"
    );

}


if (
    type !== "camo" &&
    previewType === "video"
) {

    throw new Error(
        "THIS CONTENT TYPE REQUIRES AN IMAGE PREVIEW"
    );

}


            const safeTitle =
                title
                    .toLowerCase()
                    .replace(
                        /[^a-z0-9]+/g,
                        "-"
                    )
                    .replace(
                        /^-|-$/g,
                        ""
                    );

                    const extraContentTypes = [
    "camo",
    "menu-screen",
    "gloves",
    "prestige-icon",
    "mod-asset"
];

const isExtraContent =
    extraContentTypes.includes(type);


let downloadPackageFile =
    downloadFile;


if (isExtraContent) {

    if (typeof JSZip === "undefined") {
        throw new Error(
            "ZIP SYSTEM FAILED TO LOAD"
        );
    }

    const zip =
        new JSZip();


    zip.file(
        downloadFile.name,
        downloadFile
    );


if (
    (
        type === "menu-screen" ||
        type === "prestige-icon"
    ) &&
    downloadFile2
) {

    zip.file(
        downloadFile2.name,
        downloadFile2
    );

}


    const zipBlob =
        await zip.generateAsync({
            type: "blob",
            compression: "DEFLATE",
            compressionOptions: {
                level: 6
            }
        });


    downloadPackageFile =
        new File(
            [zipBlob],
            `Plutonium-Vault-${safeTitle}.zip`,
            {
                type: "application/zip"
            }
        );

}


            /*
             * PREVIEW UPLOAD
             */

            const previewExtension =
                previewFile.name
                    .split(".")
                    .pop()
                    .toLowerCase();


            const previewPath =
                `${user.id}/${Date.now()}-${safeTitle}.${previewExtension}`;


            const {
                error:
                    previewUploadError
            } =
                await vaultSupabase
                    .storage
                    .from("submissions")
                    .upload(
                        previewPath,
                        previewFile,
                        {
                            upsert: false,
                            contentType:
                                previewFile.type
                        }
                    );


            if (
                previewUploadError
            ) {

                throw previewUploadError;

            }


            const {
                data:
                    previewUrlData
            } =
                vaultSupabase
                    .storage
                    .from("submissions")
                    .getPublicUrl(
                        previewPath
                    );


            const previewUrl =
                previewUrlData.publicUrl;

                let previewUrl2 = null;

if (
    type === "menu-screen" &&
    previewFile2
) {

    const previewExtension2 =
        previewFile2.name
            .split(".")
            .pop()
            .toLowerCase();

    const previewPath2 =
        `${user.id}/${Date.now()}-${safeTitle}-preview-2.${previewExtension2}`;

    const {
        error: previewUploadError2
    } =
        await vaultSupabase
            .storage
            .from("submissions")
            .upload(
                previewPath2,
                previewFile2,
                {
                    upsert: false,
                    contentType:
                        previewFile2.type
                }
            );

    if (previewUploadError2) {
        throw previewUploadError2;
    }

    const {
        data: previewUrlData2
    } =
        vaultSupabase
            .storage
            .from("submissions")
            .getPublicUrl(
                previewPath2
            );

    previewUrl2 =
        previewUrlData2.publicUrl;
}


            /*
             * DOWNLOAD FILE UPLOAD
             */

const downloadExtension =
    downloadPackageFile.name
        .split(".")
        .pop()
        .toLowerCase();


const downloadPath =
    `${user.id}/${Date.now()}-${safeTitle}-download.${downloadExtension}`;


const {
    error:
        downloadUploadError
} =
    await vaultSupabase
        .storage
        .from("submissions")
        .upload(
            downloadPath,
            downloadPackageFile,
            {
                upsert: false,
                contentType:
                    downloadPackageFile.type ||
                    "application/octet-stream"
            }
        );


            if (
                downloadUploadError
            ) {

                throw downloadUploadError;

            }


            const {
                data:
                    downloadUrlData
            } =
                vaultSupabase
                    .storage
                    .from("submissions")
                    .getPublicUrl(
                        downloadPath
                    );


            const downloadUrl =
                downloadUrlData.publicUrl;




            /*
             * CREATE SUBMISSION
             */

            const {
                error:
                    submissionError
            } =
                await vaultSupabase
                    .from("submissions")
                    .insert({

                        user_id:
                            user.id,

                        title:
                            title,

                        type:
                            type,

                        description:
                            description,

preview_url:
    previewUrl,

preview_url_2:
    previewUrl2,

preview_type:
    previewType,

download_url:
    downloadUrl,

status:
    "pending"

                    });


            if (
                submissionError
            ) {

                throw submissionError;

            }


            message.textContent =
                "SUBMISSION SENT FOR REVIEW";

            form.reset();


        } catch (error) {

            console.error(
                "Submission error:",
                error
            );

            message.textContent =
                error.message
                    ? error.message.toUpperCase()
                    : "UNABLE TO SUBMIT CONTENT";


        } finally {

            submitButton.disabled =
                false;

            submitButton.textContent =
                "SUBMIT FOR REVIEW";

        }

    }
);

</script>

</body>
</html>
